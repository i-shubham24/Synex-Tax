[project]
name = "recon-worker"
version = "0.1.0"
description = "Deterministic 4-pass GSTR-2B fuzzy reconciliation worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "polars>=1.0.0",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.9",
    "pydantic>=2.8.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
