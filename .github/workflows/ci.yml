name: SynTax Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-and-api:
    name: Node.js Monorepo (Web & API)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build -w @synextax/web

      - name: Run API Tests
        run: npm test -w @synextax/api --if-present

  dsc-agent:
    name: Go 1.23+ DSC Local Agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: apps/dsc-agent/go.sum

      - name: Run DSC Agent Tests
        run: |
          cd apps/dsc-agent
          go test -v ./...

      - name: Cross-compile Windows AMD64 Binary
        run: |
          cd apps/dsc-agent
          mkdir -p build
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o build/syntax-sign-windows-amd64.exe .
          ls -lh build/syntax-sign-windows-amd64.exe

  terraform:
    name: Terraform India Infrastructure Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Format Check
        run: terraform fmt -check -recursive infra/terraform

      - name: Initialize & Validate Staging
        run: |
          cd infra/terraform/environments/staging
          terraform init -backend=false
          terraform validate
